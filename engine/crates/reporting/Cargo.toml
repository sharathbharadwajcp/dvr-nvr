[package]
name = "reporting"
version = "0.1.0"
edition = "2021"
description = "Forensic timeline reconstruction, legal admissibility certificates (Section 63 BSA 2023), and artifact export for dvrft"

[dependencies]
acquisition = { path = "../acquisition" }
parser = { path = "../parser" }
correlation = { path = "../correlation" }
analytics = { path = "../analytics" }
recovery = { path = "../recovery" }
identify = { path = "../identify" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
printpdf = "0.7"

[dev-dependencies]
tempfile = "3.10"
