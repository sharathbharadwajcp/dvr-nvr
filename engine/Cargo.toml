[workspace]
resolver = "2"
members = [
    "crates/acquisition",
    "crates/dvrft",
    "crates/dvrft-gen",
    "crates/identify",
    "crates/parser",
    "crates/recovery",
    "crates/correlation",
    "crates/analytics",
    "crates/reporting",
    "crates/gui",
    "crates/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Team Cyber 4"]
license = "Apache-2.0"

[workspace.dependencies]
wasmtime = "24.0"
wat = "1.0"
blake3 = "1.5"
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
hex = "0.4"
tempfile = "3.10"
rusqlite = { version = "0.31", features = ["bundled"] }
